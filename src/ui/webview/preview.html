<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, viewport-fit=cover">
  <title>Snapmap+ preview</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      touch-action: auto;
    }

    body {
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #preview-stage {
      position: relative;
      flex: none;
      overflow: hidden;
      background: #101318;
    }

    #preview-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 1440px;
      height: 900px;
      border: 0;
      background: #101318;
      transform-origin: top left;
      touch-action: auto;
    }
  </style>
</head>
<body>
  <main id="preview-stage" aria-label="Snapmap+ desktop preview">
    <iframe id="preview-frame" src="mockup.html" title="Snapmap+ UI preview"></iframe>
  </main>
  <script>
    (function () {
      "use strict";

      var DESIGN_WIDTH = 1440;
      var DESIGN_HEIGHT = 900;
      var MIN_VERTICAL_BAR = 16;
      var stage = document.getElementById("preview-stage");
      var frame = document.getElementById("preview-frame");

      function fitPreview() {
        var root = document.documentElement;
        var availableWidth = root.clientWidth || window.innerWidth;
        var availableHeight = root.clientHeight || window.innerHeight;
        var widthScale = availableWidth / DESIGN_WIDTH;
        var heightScale = Math.max(0, availableHeight - (MIN_VERTICAL_BAR * 2)) / DESIGN_HEIGHT;
        var scale = Math.min(widthScale, heightScale);

        if (!isFinite(scale) || scale <= 0) {
          return;
        }

        stage.style.width = (DESIGN_WIDTH * scale) + "px";
        stage.style.height = (DESIGN_HEIGHT * scale) + "px";
        frame.style.transform = "scale(" + scale + ")";
      }

      window.addEventListener("resize", function () {
        var viewport = window.visualViewport;
        var pinchZoomed = viewport && typeof viewport.scale === "number" &&
          Math.abs(viewport.scale - 1) > 0.01;
        if (!pinchZoomed) {
          fitPreview();
        }
      });
      fitPreview();
    }());
  </script>
</body>
</html>
